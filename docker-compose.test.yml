##
# docker-compose.test.yml — E2E test environment overrides.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.test.yml up -d --build
#
# Or via npm:
#   npm run test:e2e:env:up      (build + start)
#   npm run test:e2e:env:setup   (build + start + init LocalStack)
#
# What this file overrides:
#
#   gateway     — injects the committed test key pair (base64-encoded PEM) so the
#                 gateway accepts E2E JWTs signed by tests/e2e/fixtures/test-private-key.pem.
#                 Without this, the gateway generates an ephemeral key pair on startup
#                 and rejects all test tokens with 401.
#                 Also overrides QUORUM_CONFIG_BUCKET and QUORUM_DDB_USER_PROJECTS_TABLE
#                 to use isolated test namespaces (quorum-configs-test, quorum-user-projects-test)
#                 so E2E runs never pollute the local dev S3/DDB state.
#
#   graphiti    — redirects OpenAI calls to the local mock-openai service.
#                 Without this, Graphiti requires a real OPENAI_API_KEY and makes
#                 live network calls, which are non-deterministic and cost money.
#
#   localstack  — NOT started in the test stack (--scale localstack=0 in env:up script).
#                 The gateway is pointed at the host's LocalStack via host.docker.internal:4566
#                 instead. Run `npm run test:e2e:env:init` once to bootstrap S3 + DDB tables.
#
#   mock-openai — lightweight Node.js HTTP server that returns valid but synthetic
#                 OpenAI embedding vectors and chat completion responses. Deterministic
#                 embeddings enable FalkorDB vector indexing in tests. No real API key.
#
# These are committed test keys — NOT production secrets. The private key exists
# solely to let the test suite produce JWTs without running the full OAuth flow.
# The keys are P-256 (ES256) and should never be used outside the test environment.
##

name: quorum-test

services:

  gateway:
    environment:
      # Inject the E2E test key pair so the gateway accepts test-signed JWTs.
      # Values are base64-encoded PEM — decoded by keys.js via Buffer.from(b64,'base64').
      # Generated from tests/e2e/fixtures/test-{private,public}-key.pem.
      - QUORUM_JWT_PRIVATE_
      - QUORUM_JWT_PUBLIC_KEY=LS0tLS1CRUdJTiBQVUJMSUMgS0VZLS0tLS0KTUZrd0V3WUhLb1pJemowQ0FRWUlLb1pJemowREFRY0RRZ0FFdmIzV0huMkpRYWZYU3owNmdGcXFOSHAyaGNIcwpVOU5HZy9rcGlmdi9FS3EzZXFnMzI1bURqdUo0WWVaelBWNHB4MzBhQ0szdVMvVk9waVp4SFFaOGVnPT0KLS0tLS1FTkQgUFVCTElDIEtFWS0tLS0tCg==
      # Isolated test S3 bucket + DDB table — keeps E2E data out of the dev namespace.
      # Both must match the values passed to init-localstack.sh via test:e2e:env:init.
      - QUORUM_CONFIG_BUCKET=quorum-configs-test
      - QUORUM_DDB_USER_PROJECTS_TABLE=quorum-user-projects-test
      # Point S3/DDB calls at the host's LocalStack rather than a container.
      # host.docker.internal resolves to the host machine from inside Docker (macOS/Windows).
      # On Linux add: extra_hosts: ["host.docker.internal:host-gateway"]
      - AWS_ENDPOINT_URL=http://host.docker.internal:4566
      # Mark as test env — keeps dev-only features enabled without production guards.
      - NODE_ENV=test
    extra_hosts:
      # Ensures host.docker.internal resolves correctly on Linux hosts too.
      - "host.docker.internal:host-gateway"

  graphiti:
    environment:
      # Redirect all OpenAI calls to the local mock service.
      # The OpenAI Python SDK respects OPENAI_BASE_URL — Graphiti uses the SDK.
      - OPENAI_API_KEY=test-key-e2e
      - OPENAI_BASE_URL=http://mock-openai:3003
    depends_on:
      mock-openai:
        condition: service_healthy

  # Suppress the localstack container entirely — the test stack reuses the
  # LocalStack already running on the host (reached via host.docker.internal:4566).
  # Assigning a profile prevents Docker Compose from starting this service by
  # default, even when another service lists it under depends_on with required:false.
  localstack:
    profiles:
      - localstack

  # Minimal OpenAI API mock — returns deterministic embedding vectors and canned
  # chat completions. Enables Graphiti/FalkorDB indexing without a real API key.
  mock-openai:
    build:
      context: ./mock-openai
    ports:
      - "3003:3003"
    healthcheck:
      # Use node itself rather than wget — node is guaranteed in node:20-alpine,
      # and busybox wget's behaviour with -qO- is inconsistent across image versions.
      test:
        - "CMD"
        - "node"
        - "-e"
        - "require('http').get('http://127.0.0.1:3003/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
