name: quorum

services:
  # LocalStack — AWS S3 emulation for local dev.
  # The gateway reads team config from S3; for local Docker Compose runs we point
  # it here instead of real AWS. Bucket is created by scripts/init-localstack.sh
  # (called automatically by setup.sh docker after the stack is healthy).
  #
  # Profile: internal-localstack — enabled by default via COMPOSE_PROFILES in
  # .env.example. If you run an external LocalStack instance on the host (e.g.
  # for Crossplane/k8s tooling) and want the gateway to reuse it instead, set
  # in your own .env (not committed):
  #   COMPOSE_PROFILES=            # disables this service, avoids port 4566 clash
  #   AWS_ENDPOINT_URL=http://host.docker.internal:4566
  localstack:
    profiles: ["internal-localstack"]
    image: localstack/localstack:latest
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,dynamodb
      - DEFAULT_REGION=us-east-1
      - AWS_DEFAULT_REGION=us-east-1
    volumes:
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5

  falkordb:
    image: falkordb/falkordb:latest
    ports:
      - "6379:6379"
      - "3000:3000"  # FalkorDB browser UI
    volumes:
      - falkordb_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgresql:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: quorum_audit
      POSTGRES_USER: quorum
      POSTGRES_PASSWORD: quorum_local
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quorum -d quorum_audit"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Graphiti runs as a Python sidecar — Quorum (Node.js) calls it via HTTP.
  # Graphiti has no npm package — do NOT try to import it into Node.js.
  graphiti:
    image: ghcr.io/ayansasmal/graphiti-mcp:${GRAPHITI_TAG:-latest}
    ports:
      - "8001:8000"  # host:container — inside Docker network use http://graphiti:8000
    environment:
      - FALKORDB_URI=redis://falkordb:6379
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LLM_MODEL_NAME=${LLM_MODEL_NAME:-gpt-4o-mini}
      - EMBEDDER_MODEL_NAME=${EMBEDDER_MODEL_NAME:-text-embedding-3-small}
      - GROUP_ID=${QUORUM_GROUP_ID:-default}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    depends_on:
      falkordb:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Quorum Gateway — central microservice, holds all infrastructure credentials.
  # Engineers only need QUORUM_GATEWAY_URL + their GitHub token.
  # Exposes port 3001. In production, place behind a TLS-terminating load balancer.
  gateway:
    image: quorum-gateway:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.gateway
    ports:
      - "3001:3001"
    environment:
      # Infrastructure (only the gateway holds these — never on engineer machines)
      - GRAPHITI_URL=http://graphiti:8000
      - POSTGRES_HOST=postgresql
      - POSTGRES_PORT=5432
      - POSTGRES_USER=quorum
      - POSTGRES_PASSWORD=quorum_local
      - POSTGRES_DB=quorum_audit
      - QUORUM_CONFIG_BUCKET=${QUORUM_CONFIG_BUCKET:-quorum-configs}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      # LocalStack — defaults to the compose-managed `localstack` service above.
      # Override in your own .env to point at an external, host-run instance
      # instead (see profile note above).
      - AWS_ENDPOINT_URL=${AWS_ENDPOINT_URL:-http://localstack:4566}
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - QUORUM_DDB_CONFIGS_TABLE=${QUORUM_DDB_CONFIGS_TABLE:-quorum-configs}
      - QUORUM_DDB_USER_PROJECTS_TABLE=${QUORUM_DDB_USER_PROJECTS_TABLE:-quorum-user-projects}
      - QUORUM_SYNC_SECRET=${QUORUM_SYNC_SECRET:-}
      - REDIS_URL=redis://redis:6379
      - QUORUM_ADMIN_CACHE_TTL=${QUORUM_ADMIN_CACHE_TTL:-300}
      - QUORUM_PROFILE_CACHE_TTL=${QUORUM_PROFILE_CACHE_TTL:-300}
      # JWT signing keys — generate with openssl, store in secrets manager for production
      # Leave unset in dev: gateway generates an ephemeral key pair automatically
      - QUORUM_JWT_PRIVATE_KEY=${QUORUM_JWT_PRIVATE_KEY:-}
      - QUORUM_JWT_PUBLIC_KEY=${QUORUM_JWT_PUBLIC_KEY:-}
      - QUORUM_GATEWAY_PORT=3001
      # Local dev only — skip S3, load config from this path inside the container
      - QUORUM_CONFIG_PATH=${QUORUM_CONFIG_PATH:-}
      # GitHub OAuth — register at github.com/settings/developers
      # Homepage URL: http://localhost:3002  |  Callback URL: http://localhost:3001/oauth/callback
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - GITHUB_CALLBACK_URL=${GITHUB_CALLBACK_URL:-http://localhost:3001/oauth/callback}
      - DASHBOARD_URL=${DASHBOARD_URL:-http://localhost:3002}
      - NODE_ENV=${NODE_ENV:-development}
    volumes:
      - ./quorum.config.example.json:/app/quorum.config.example.json:ro
    depends_on:
      postgresql:
        condition: service_healthy
      graphiti:
        condition: service_healthy
      localstack:
        condition: service_healthy
        required: false   # setup.sh may reuse an external LocalStack; skip if absent
      redis:
        condition: service_healthy
    healthcheck:
      # Accept 200 (healthy) or 503 (degraded) — both mean the gateway is alive.
      # curl -f would kill the container whenever any downstream component is down.
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost:3001/health | grep -qE '^(200|503)$'"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  # Quorum Dashboard — opt-in local service (profile: dashboard).
  # Build context is the sibling quorum-dash repo. nginx proxies /api/* → gateway:3001
  # so the browser stays same-origin and no CORS is needed.
  #
  # Start:   npm run docker:start:dash   (or: docker compose --profile dashboard up -d)
  # Rebuild: npm run docker:rebuild:dash
  #
  # Requires: quorum-dash repo checked out as a sibling of this repo.
  #   Layout: qc/quorum/ (this repo) + qc/quorum-dash/ (dashboard repo)
  dashboard:
    profiles: ["dashboard"]
    build:
      context: ../quorum-dash
      dockerfile: Dockerfile
    ports:
      - "3002:8080"
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3

  # Quorum MCP — runs on engineer machines via Claude Code MCP config, not Docker.
  # Opt-in only: docker compose --profile mcp up
  # Requires @as-quorum/mcp to be published to npm.
  quorum:
    profiles: ["mcp"]
    image: quorum:${IMAGE_TAG:-latest}
    build: .
    ports:
      - "8000:8000"
    environment:
      # When QUORUM_GATEWAY_URL is set, Quorum routes all DB + Graphiti calls
      # through the gateway instead of connecting directly.
      - QUORUM_GATEWAY_URL=http://gateway:3001
      - QUORUM_GROUP_ID=${QUORUM_GROUP_ID:-default}
      - QUORUM_CONFLICT_THRESHOLD=${QUORUM_CONFLICT_THRESHOLD:-0.85}
      - QUORUM_AUTHORITY_THRESHOLD=${QUORUM_AUTHORITY_THRESHOLD:-0.20}
      - QUORUM_PORT=8000
      - NODE_ENV=${NODE_ENV:-development}
      # For local dev without gateway: direct connections
      - GRAPHITI_URL=http://graphiti:8000
      - POSTGRES_HOST=postgresql
      - POSTGRES_PORT=5432
      - POSTGRES_USER=quorum
      - POSTGRES_PASSWORD=quorum_local
      - POSTGRES_DB=quorum_audit
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      falkordb:
        condition: service_healthy
      postgresql:
        condition: service_healthy
      graphiti:
        condition: service_healthy
      gateway:
        condition: service_healthy

volumes:
  falkordb_data:
  postgres_data:
  localstack_data:
