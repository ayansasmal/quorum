# Quorum Helm Chart — Docker Desktop Kubernetes overrides
# Usage: helm upgrade --install quorum ./helm/quorum -f helm/quorum/values-local.yaml

# ── Dashboard local overrides ─────────────────────────────────────────────────
# NodePort 30080 lets you reach the dashboard at http://localhost:30080 on Docker Desktop.
# No ingress controller required for local dev.
dashboard:
  replicaCount: 1
  ingress:
    enabled: false
  service:
    type: NodePort
    port: 80
    nodePort: 30080

gateway:
  replicaCount: 1
  ingress:
    enabled: false
  env:
    NODE_ENV: development
    AWS_REGION: us-east-1              # LocalStack default region
    QUORUM_CONFIG_BUCKET: quorum-configs  # matches Crossplane-provisioned bucket
    awsEndpointUrl: "http://host.docker.internal:4566"  # LocalStack S3 endpoint
  jwtSecret:
    privateKey: ""   # left empty: gateway generates ephemeral key pair in dev mode
    publicKey: ""

falkordb:
  persistence:
    enabled: false  # ephemeral for local dev
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

postgresql:
  password: quorum_local
  persistence:
    enabled: false  # ephemeral for local dev
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

graphiti:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
