{{- if .Values.postgresql.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "quorum.postgresql.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "quorum.postgresql.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None  # headless for StatefulSet DNS
  ports:
    - port: {{ .Values.postgresql.port }}
      targetPort: postgresql
      protocol: TCP
      name: postgresql
  selector:
    {{- include "quorum.postgresql.selectorLabels" . | nindent 4 }}
{{- end -}}
