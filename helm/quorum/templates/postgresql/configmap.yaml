{{- if .Values.postgresql.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "quorum.postgresql.fullname" . }}-init
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "quorum.postgresql.labels" . | nindent 4 }}
data:
  init.sql: |
    {{- .Files.Get "files/init-db.sql" | nindent 4 }}
{{- end -}}
