{{- if .Values.archiveJob.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "quorum.fullname" . }}-archive-audit
  labels:
    {{- include "quorum.labels" . | nindent 4 }}
    app.kubernetes.io/component: archive-job
spec:
  # Monthly: 1st of month, 3am UTC
  schedule: {{ .Values.archiveJob.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            {{- include "quorum.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: archive-job
        spec:
          restartPolicy: OnFailure
          containers:
            - name: archive-audit
              image: "{{ .Values.gateway.image.repository }}:{{ .Values.gateway.image.tag }}"
              imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
              command: ["node", "scripts/archive-audit.js"]
              env:
                - name: POSTGRES_HOST
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "quorum.fullname" . }}-postgresql-secret
                      key: host
                - name: POSTGRES_PORT
                  value: "5432"
                - name: POSTGRES_DB
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "quorum.fullname" . }}-postgresql-secret
                      key: database
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "quorum.fullname" . }}-postgresql-secret
                      key: username
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "quorum.fullname" . }}-postgresql-secret
                      key: password
                - name: AWS_REGION
                  value: {{ .Values.archiveJob.awsRegion | default "ap-southeast-2" | quote }}
                {{- if .Values.archiveJob.s3Bucket }}
                - name: QUORUM_ARCHIVE_BUCKET
                  value: {{ .Values.archiveJob.s3Bucket | quote }}
                {{- end }}
                {{- if .Values.archiveJob.afterDays }}
                - name: ARCHIVE_AFTER_DAYS
                  value: {{ .Values.archiveJob.afterDays | quote }}
                {{- end }}
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
{{- end }}
