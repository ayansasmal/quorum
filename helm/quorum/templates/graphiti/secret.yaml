{{- if and .Values.graphiti.enabled .Values.graphiti.openaiSecret.apiKey (not .Values.graphiti.openaiSecret.existingSecret) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "quorum.graphiti.openaiSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "quorum.graphiti.labels" . | nindent 4 }}
type: Opaque
data:
  apiKey: {{ .Values.graphiti.openaiSecret.apiKey | b64enc | quote }}
{{- end -}}
