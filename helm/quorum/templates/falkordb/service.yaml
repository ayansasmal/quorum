{{- if .Values.falkordb.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "quorum.falkordb.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "quorum.falkordb.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None  # headless for StatefulSet DNS
  ports:
    - port: {{ .Values.falkordb.port }}
      targetPort: redis
      protocol: TCP
      name: redis
    - port: {{ .Values.falkordb.uiPort }}
      targetPort: ui
      protocol: TCP
      name: ui
  selector:
    {{- include "quorum.falkordb.selectorLabels" . | nindent 4 }}
{{- end -}}
