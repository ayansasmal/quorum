{{- if .Values.falkordb.enabled -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "quorum.falkordb.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "quorum.falkordb.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "quorum.falkordb.fullname" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "quorum.falkordb.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "quorum.falkordb.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: falkordb
          image: "{{ .Values.falkordb.image.repository }}:{{ .Values.falkordb.image.tag }}"
          imagePullPolicy: {{ .Values.falkordb.image.pullPolicy }}
          ports:
            - name: redis
              containerPort: {{ .Values.falkordb.port }}
            - name: ui
              containerPort: {{ .Values.falkordb.uiPort }}
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.falkordb.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      {{- if not .Values.falkordb.persistence.enabled }}
      volumes:
        - name: data
          emptyDir: {}
      {{- end }}
  {{- if .Values.falkordb.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.falkordb.persistence.size }}
        {{- if .Values.falkordb.persistence.storageClass }}
        storageClassName: {{ .Values.falkordb.persistence.storageClass }}
        {{- end }}
  {{- end }}
{{- end -}}
