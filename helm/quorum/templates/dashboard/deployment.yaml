{{- if .Values.dashboard.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "quorum.dashboard.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "quorum.dashboard.labels" . | nindent 4 }}
  {{- with .Values.dashboard.podAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.dashboard.replicaCount }}
  selector:
    matchLabels:
      {{- include "quorum.dashboard.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "quorum.dashboard.selectorLabels" . | nindent 8 }}
      {{- with .Values.dashboard.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # envsubst rewrites the nginx ConfigMap at startup, substituting $GATEWAY_URL.
      # The processed config is written to an emptyDir so the nginx user can write it.
      initContainers:
        - name: nginx-config-init
          image: "{{ if .Values.global.imageRegistry }}{{ .Values.global.imageRegistry }}/{{ end }}{{ .Values.dashboard.image.repository }}:{{ .Values.dashboard.image.tag }}"
          imagePullPolicy: {{ .Values.dashboard.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              envsubst '$GATEWAY_URL' \
                < /etc/nginx/templates/default.conf \
                > /etc/nginx/conf.d/default.conf
          env:
            - name: GATEWAY_URL
              value: "http://{{ include "quorum.gateway.fullname" . }}:{{ .Values.gateway.port }}"
          volumeMounts:
            - name: nginx-template
              mountPath: /etc/nginx/templates
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
      containers:
        - name: dashboard
          image: "{{ if .Values.global.imageRegistry }}{{ .Values.global.imageRegistry }}/{{ end }}{{ .Values.dashboard.image.repository }}:{{ .Values.dashboard.image.tag }}"
          imagePullPolicy: {{ .Values.dashboard.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.dashboard.resources | nindent 12 }}
      volumes:
        - name: nginx-template
          configMap:
            name: {{ include "quorum.dashboard.fullname" . }}-nginx
        - name: nginx-config
          emptyDir: {}
      {{- with .Values.dashboard.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.dashboard.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end -}}
