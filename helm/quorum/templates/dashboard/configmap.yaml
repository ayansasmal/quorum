{{- if .Values.dashboard.enabled -}}
# Nginx config for the Quorum dashboard.
# $GATEWAY_URL is substituted at container startup via envsubst — the Deployment
# injects the in-cluster gateway service URL as GATEWAY_URL env var.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "quorum.dashboard.fullname" . }}-nginx
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "quorum.dashboard.labels" . | nindent 4 }}
data:
  default.conf: |
    server {
      listen 80;
      root /usr/share/nginx/html;
      index index.html;

      # Proxy API/auth calls to the Gateway service (in-cluster DNS)
      location ~ ^/(auth|api|\.well-known|config|health) {
        proxy_pass $GATEWAY_URL;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }

      # Cache static assets aggressively — Vite hashes filenames so stale cache is impossible
      location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
      }

      # SPA routing — all non-asset paths serve index.html
      location / {
        try_files $uri $uri/ /index.html;
      }
    }
{{- end -}}
