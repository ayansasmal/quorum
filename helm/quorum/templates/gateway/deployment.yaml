{{- if .Values.gateway.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "quorum.gateway.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "quorum.gateway.labels" . | nindent 4 }}
  {{- with .Values.gateway.podAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.gateway.replicaCount }}
  selector:
    matchLabels:
      {{- include "quorum.gateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "quorum.gateway.selectorLabels" . | nindent 8 }}
      {{- with .Values.gateway.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.gateway.serviceAccount.create }}
      serviceAccountName: {{ include "quorum.gateway.fullname" . }}
      {{- end }}
      containers:
        - name: gateway
          image: "{{ if .Values.global.imageRegistry }}{{ .Values.global.imageRegistry }}/{{ end }}{{ .Values.gateway.image.repository }}:{{ .Values.gateway.image.tag }}"
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.gateway.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "quorum.gateway.fullname" . }}
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "quorum.postgresql.secretName" . }}
                  key: {{ .Values.postgresql.existingSecretKey }}
            - name: QUORUM_JWT_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "quorum.gateway.jwtSecretName" . }}
                  key: QUORUM_JWT_PRIVATE_KEY
            - name: QUORUM_JWT_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "quorum.gateway.jwtSecretName" . }}
                  key: QUORUM_JWT_PUBLIC_KEY
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
      {{- with .Values.gateway.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.gateway.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.gateway.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end -}}
