{{- if and .Values.gateway.enabled .Values.gateway.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "quorum.gateway.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "quorum.gateway.labels" . | nindent 4 }}
  {{- with .Values.gateway.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end -}}
