apiVersion: aws.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: aws-provider
spec:
  # Force path-style S3 URLs: http://endpoint/bucket/key
  # Required for LocalStack — path-style is handled natively without DNS tricks.
  # PRODUCTION: remove this field.
  s3_use_path_style: true

  # Skip STS/metadata API calls not available the same way in LocalStack.
  skip_credentials_validation: true
  skip_metadata_api_check: true
  skip_region_validation: true

  endpoint:
    source: Custom
    hostnameImmutable: true
    signingRegion: us-east-1
    url:
      type: Static
      static: "http://host.docker.internal:4566"
    # Explicitly list services this endpoint applies to.
    # Without services, the provider may only apply the endpoint to non-S3 services
    # (STS, IAM, etc.) and leave S3 using the default AWS endpoint resolution.
    services:
      - s3
      - sts

  # LocalStack accepts any non-empty credentials — test/test is the convention.
  # PRODUCTION: credentials.source: IRSA
  credentials:
    source: Secret
    secretRef:
      namespace: crossplane-system
      name: aws-creds
      key: credentials
