# Flat production composition. All managed resources are namespaced v2 APIs.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: xquorumenvironment
  labels:
    provider: aws
    environment: prod
spec:
  compositeTypeRef:
    apiVersion: platform.quorum.dev/v1alpha1
    kind: XQuorumEnvironment
  mode: Pipeline
  pipeline:
    - step: patch-and-transform
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        resources:
          - name: encryption-key
            base:
              apiVersion: kms.aws.m.upbound.io/v1beta1
              kind: Key
              metadata:
                labels: { quorum.io/environment: prod }
              spec:
                forProvider:
                  region: ap-southeast-2
                  description: Quorum production data encryption
                  enableKeyRotation: true
                  deletionWindowInDays: 7
                providerConfigRef: { name: aws-prod, kind: ProviderConfig }
          - name: vpc
            base:
              apiVersion: ec2.aws.m.upbound.io/v1beta1
              kind: VPC
              metadata:
                labels: { quorum.io/environment: prod }
              spec:
                forProvider:
                  region: ap-southeast-2
                  cidrBlock: 10.20.0.0/16
                  enableDnsHostnames: true
                  enableDnsSupport: true
                  tags: { Name: quorum-prod }
                providerConfigRef: { name: aws-prod, kind: ProviderConfig }
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.network.vpcCidr
                toFieldPath: spec.forProvider.cidrBlock
          - name: public-subnet
            base:
              apiVersion: ec2.aws.m.upbound.io/v1beta1
              kind: Subnet
              metadata:
                labels: { quorum.io/tier: public }
              spec:
                forProvider:
                  region: ap-southeast-2
                  availabilityZone: ap-southeast-2a
                  cidrBlock: 10.20.1.0/24
                  mapPublicIpOnLaunch: true
                  vpcIdSelector:
                    matchControllerRef: true
                providerConfigRef: { name: aws-prod, kind: ProviderConfig }
          - name: private-subnet-a
            base:
              apiVersion: ec2.aws.m.upbound.io/v1beta1
              kind: Subnet
              metadata:
                labels: { quorum.io/tier: database }
              spec:
                forProvider:
                  region: ap-southeast-2
                  availabilityZone: ap-southeast-2a
                  cidrBlock: 10.20.10.0/24
                  vpcIdSelector:
                    matchControllerRef: true
                providerConfigRef: { name: aws-prod, kind: ProviderConfig }
          - name: private-subnet-b
            base:
              apiVersion: ec2.aws.m.upbound.io/v1beta1
              kind: Subnet
              metadata:
                labels: { quorum.io/tier: database }
              spec:
                forProvider:
                  region: ap-southeast-2
                  availabilityZone: ap-southeast-2b
                  cidrBlock: 10.20.11.0/24
                  vpcIdSelector:
                    matchControllerRef: true
                providerConfigRef: { name: aws-prod, kind: ProviderConfig }
          - name: internet-gateway
            base:
              apiVersion: ec2.aws.m.upbound.io/v1beta1
              kind: InternetGateway
              spec:
                forProvider:
                  region: ap-southeast-2
                  vpcIdSelector:
                    matchControllerRef: true
                providerConfigRef: { name: aws-prod, kind: ProviderConfig }
          - name: public-route-table
            base:
              apiVersion: ec2.aws.m.upbound.io/v1beta1
              kind: RouteTable
              metadata:
                labels: { quorum.io/route-table: public }
              spec:
                forProvider:
                  region: ap-southeast-2
                  vpcIdSelector:
                    matchControllerRef: true
                providerConfigRef: { name: aws-prod, kind: ProviderConfig }
          - name: public-default-route
            base:
              apiVersion: ec2.aws.m.upbound.io/v1beta1
              kind: Route
              spec:
                forProvider:
                  region: ap-southeast-2
                  destinationCidrBlock: 0.0.0.0/0
                  gatewayIdSelector:
                    matchControllerRef: true
                  routeTableIdSelector:
                    matchControllerRef: true
                    matchLabels: { quorum.io/route-table: public }
                providerConfigRef: { name: aws-prod, kind: ProviderConfig }
          - name: public-route-table-association
            base:
              apiVersion: ec2.aws.m.upbound.io/v1beta1
              kind: RouteTableAssociation
              spec:
                forProvider:
                  region: ap-southeast-2
                  routeTableIdSelector:
                    matchControllerRef: true
                    matchLabels: { quorum.io/route-table: public }
                  subnetIdSelector:
                    matchControllerRef: true
                    matchLabels: { quorum.io/tier: public }
                providerConfigRef: { name: aws-prod, kind: ProviderConfig }
          - name: app-security-group
            base:
              apiVersion: ec2.aws.m.upbound.io/v1beta1
              kind: SecurityGroup
              metadata:
                labels: { quorum.io/security-group: app }
              spec:
                forProvider:
                  region: ap-southeast-2
                  description: HTTPS ingress for Quorum gateway
                  name: quorum-prod-app
                  vpcIdSelector:
                    matchControllerRef: true
                providerConfigRef: { name: aws-prod, kind: ProviderConfig }
          - name: app-http-ingress
            base:
              apiVersion: ec2.aws.m.upbound.io/v1beta1
              kind: SecurityGroupRule
              spec:
                forProvider:
                  region: ap-southeast-2
                  type: ingress
                  cidrBlocks: [0.0.0.0/0]
                  fromPort: 80
                  toPort: 80
                  protocol: tcp
                  securityGroupIdSelector:
                    matchControllerRef: true
                    matchLabels: { quorum.io/security-group: app }
                providerConfigRef: { name: aws-prod, kind: ProviderConfig }
          - name: app-https-ingress
            base:
              apiVersion: ec2.aws.m.upbound.io/v1beta1
              kind: SecurityGroupRule
              spec:
                forProvider:
                  region: ap-southeast-2
                  type: ingress
                  cidrBlocks: [0.0.0.0/0]
                  fromPort: 443
                  toPort: 443
                  protocol: tcp
                  securityGroupIdSelector:
                    matchControllerRef: true
                    matchLabels: { quorum.io/security-group: app }
                providerConfigRef: { name: aws-prod, kind: ProviderConfig }
          - name: app-egress
            base:
              apiVersion: ec2.aws.m.upbound.io/v1beta1
              kind: SecurityGroupRule
              spec:
                forProvider:
                  region: ap-southeast-2
                  type: egress
                  cidrBlocks: [0.0.0.0/0]
                  fromPort: 0
                  toPort: 0
                  protocol: "-1"
                  securityGroupIdSelector:
                    matchControllerRef: true
                    matchLabels: { quorum.io/security-group: app }
                providerConfigRef: { name: aws-prod, kind: ProviderConfig }
          - name: database-security-group
            base:
              apiVersion: ec2.aws.m.upbound.io/v1beta1
              kind: SecurityGroup
              metadata:
                labels: { quorum.io/security-group: database }
              spec:
                forProvider:
                  region: ap-southeast-2
                  description: PostgreSQL from Quorum application only
                  name: quorum-prod-database
                  vpcIdSelector:
                    matchControllerRef: true
                providerConfigRef: { name: aws-prod, kind: ProviderConfig }
          - name: database-ingress
            base:
              apiVersion: ec2.aws.m.upbound.io/v1beta1
              kind: SecurityGroupRule
              spec:
                forProvider:
                  region: ap-southeast-2
                  type: ingress
                  fromPort: 5432
                  toPort: 5432
                  protocol: tcp
                  securityGroupIdSelector:
                    matchControllerRef: true
                    matchLabels: { quorum.io/security-group: database }
                  sourceSecurityGroupIdSelector:
                    matchControllerRef: true
                    matchLabels: { quorum.io/security-group: app }
                providerConfigRef: { name: aws-prod, kind: ProviderConfig }
          - name: config-bucket
            base:
              apiVersion: s3.aws.m.upbound.io/v1beta1
              kind: Bucket
              metadata:
                annotations: { crossplane.io/external-name: quorum-prod-config }
                labels: { quorum.io/bucket: config }
              spec:
                forProvider: { region: ap-southeast-2 }
                providerConfigRef: { name: aws-prod, kind: ProviderConfig }
          - name: deploy-bucket
            base:
              apiVersion: s3.aws.m.upbound.io/v1beta1
              kind: Bucket
              metadata:
                annotations: { crossplane.io/external-name: quorum-prod-deploy }
                labels: { quorum.io/bucket: deploy }
              spec:
                forProvider: { region: ap-southeast-2 }
                providerConfigRef: { name: aws-prod, kind: ProviderConfig }
          - name: snapshot-bucket
            base:
              apiVersion: s3.aws.m.upbound.io/v1beta1
              kind: Bucket
              metadata:
                annotations: { crossplane.io/external-name: quorum-prod-snapshots }
                labels: { quorum.io/bucket: snapshots }
              spec:
                forProvider: { region: ap-southeast-2 }
                providerConfigRef: { name: aws-prod, kind: ProviderConfig }
          - name: config-bucket-versioning
            base: &bucketVersioning
              apiVersion: s3.aws.m.upbound.io/v1beta1
              kind: BucketVersioning
              spec:
                forProvider:
                  region: ap-southeast-2
                  bucketSelector:
                    matchControllerRef: true
                    matchLabels: { quorum.io/bucket: config }
                  versioningConfiguration: { status: Enabled }
                providerConfigRef: { name: aws-prod, kind: ProviderConfig }
          - name: deploy-bucket-versioning
            base:
              <<: *bucketVersioning
              spec:
                forProvider:
                  region: ap-southeast-2
                  bucketSelector:
                    matchControllerRef: true
                    matchLabels: { quorum.io/bucket: deploy }
                  versioningConfiguration: { status: Enabled }
                providerConfigRef: { name: aws-prod, kind: ProviderConfig }
          - name: snapshot-bucket-versioning
            base:
              <<: *bucketVersioning
              spec:
                forProvider:
                  region: ap-southeast-2
                  bucketSelector:
                    matchControllerRef: true
                    matchLabels: { quorum.io/bucket: snapshots }
                  versioningConfiguration: { status: Enabled }
                providerConfigRef: { name: aws-prod, kind: ProviderConfig }
          - name: config-bucket-encryption
            base: &bucketEncryption
              apiVersion: s3.aws.m.upbound.io/v1beta1
              kind: BucketServerSideEncryptionConfiguration
              spec:
                forProvider:
                  region: ap-southeast-2
                  bucketSelector:
                    matchControllerRef: true
                    matchLabels: { quorum.io/bucket: config }
                  rule:
                    - applyServerSideEncryptionByDefault:
                        sseAlgorithm: aws:kms
                        kmsMasterKeyIdSelector: { matchControllerRef: true }
                      bucketKeyEnabled: true
                providerConfigRef: { name: aws-prod, kind: ProviderConfig }
          - name: deploy-bucket-encryption
            base:
              <<: *bucketEncryption
              spec:
                forProvider:
                  region: ap-southeast-2
                  bucketSelector:
                    matchControllerRef: true
                    matchLabels: { quorum.io/bucket: deploy }
                  rule:
                    - applyServerSideEncryptionByDefault:
                        sseAlgorithm: aws:kms
                        kmsMasterKeyIdSelector: { matchControllerRef: true }
                      bucketKeyEnabled: true
                providerConfigRef: { name: aws-prod, kind: ProviderConfig }
          - name: snapshot-bucket-encryption
            base:
              <<: *bucketEncryption
              spec:
                forProvider:
                  region: ap-southeast-2
                  bucketSelector:
                    matchControllerRef: true
                    matchLabels: { quorum.io/bucket: snapshots }
                  rule:
                    - applyServerSideEncryptionByDefault:
                        sseAlgorithm: aws:kms
                        kmsMasterKeyIdSelector: { matchControllerRef: true }
                      bucketKeyEnabled: true
                providerConfigRef: { name: aws-prod, kind: ProviderConfig }
          - name: membership-table
            base:
              apiVersion: dynamodb.aws.m.upbound.io/v1beta1
              kind: Table
              metadata:
                annotations: { crossplane.io/external-name: quorum-user-projects }
              spec:
                forProvider:
                  region: ap-southeast-2
                  billingMode: PAY_PER_REQUEST
                  hashKey: github_username
                  rangeKey: group_id
                  attribute:
                    - { name: github_username, type: S }
                    - { name: group_id, type: S }
                providerConfigRef: { name: aws-prod, kind: ProviderConfig }
          - name: database-subnet-group
            base:
              apiVersion: rds.aws.m.upbound.io/v1beta1
              kind: SubnetGroup
              metadata:
                labels: { quorum.io/database: prod }
              spec:
                forProvider:
                  region: ap-southeast-2
                  description: Private subnets for Quorum PostgreSQL
                  subnetIdSelector:
                    matchControllerRef: true
                    matchLabels: { quorum.io/tier: database }
                providerConfigRef: { name: aws-prod, kind: ProviderConfig }
          - name: database
            base:
              apiVersion: rds.aws.m.upbound.io/v1beta1
              kind: Instance
              metadata:
                annotations: { crossplane.io/external-name: quorum-prod }
              spec:
                forProvider:
                  region: ap-southeast-2
                  engine: postgres
                  engineVersion: "16"
                  instanceClass: db.t4g.micro
                  allocatedStorage: 20
                  username: quorum
                  manageMasterUserPassword: true
                  storageEncrypted: true
                  publiclyAccessible: false
                  backupRetentionPeriod: 7
                  dbSubnetGroupNameSelector:
                    matchControllerRef: true
                    matchLabels: { quorum.io/database: prod }
                  vpcSecurityGroupIdSelector:
                    matchControllerRef: true
                    matchLabels: { quorum.io/security-group: database }
                  skipFinalSnapshot: false
                  finalSnapshotIdentifier: quorum-prod-final
                providerConfigRef: { name: aws-prod, kind: ProviderConfig }
            patches:
              - { type: FromCompositeFieldPath, fromFieldPath: "spec.database.identifier", toFieldPath: "metadata.annotations[crossplane.io/external-name]" }
              - { type: FromCompositeFieldPath, fromFieldPath: "spec.database.engineVersion", toFieldPath: "spec.forProvider.engineVersion" }
              - { type: FromCompositeFieldPath, fromFieldPath: "spec.database.instanceClass", toFieldPath: "spec.forProvider.instanceClass" }
              - { type: FromCompositeFieldPath, fromFieldPath: "spec.database.allocatedStorageGiB", toFieldPath: "spec.forProvider.allocatedStorage" }
              - { type: FromCompositeFieldPath, fromFieldPath: "spec.database.masterUsername", toFieldPath: "spec.forProvider.username" }
              # Surface the RDS endpoint (address:port) on the XR for visibility.
              - { type: ToCompositeFieldPath, fromFieldPath: "status.atProvider.endpoint", toFieldPath: "status.rdsEndpoint" }
          - name: instance-role
            base:
              apiVersion: iam.aws.m.upbound.io/v1beta1
              kind: Role
              metadata:
                annotations: { crossplane.io/external-name: quorum-prod-instance }
                labels: { quorum.io/role: instance }
              spec:
                forProvider:
                  assumeRolePolicy: '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Service":"ec2.amazonaws.com"},"Action":"sts:AssumeRole"}]}'
                providerConfigRef: { name: aws-prod, kind: ProviderConfig }
          - name: scheduler-role
            base:
              apiVersion: iam.aws.m.upbound.io/v1beta1
              kind: Role
              metadata:
                annotations: { crossplane.io/external-name: quorum-prod-scheduler }
                labels: { quorum.io/role: scheduler }
              spec:
                forProvider:
                  assumeRolePolicy: '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Service":"scheduler.amazonaws.com"},"Action":"sts:AssumeRole"}]}'
                providerConfigRef: { name: aws-prod, kind: ProviderConfig }
          - name: budget-role
            base:
              apiVersion: iam.aws.m.upbound.io/v1beta1
              kind: Role
              metadata:
                annotations: { crossplane.io/external-name: quorum-prod-budget }
                labels: { quorum.io/role: budget }
              spec:
                forProvider:
                  assumeRolePolicy: '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Service":"budgets.amazonaws.com"},"Action":"sts:AssumeRole"}]}'
                providerConfigRef: { name: aws-prod, kind: ProviderConfig }
          - name: instance-role-policy
            base:
              apiVersion: iam.aws.m.upbound.io/v1beta1
              kind: RolePolicy
              spec:
                forProvider:
                  roleSelector:
                    matchControllerRef: true
                    matchLabels: { quorum.io/role: instance }
                  policy: >-
                    {"Version":"2012-10-17","Statement":[
                    {"Effect":"Allow","Action":["secretsmanager:GetSecretValue","rds:DescribeDBInstances","rds-db:connect"],"Resource":"*"},
                    {"Effect":"Allow","Action":["s3:GetObject","s3:PutObject","s3:ListBucket"],"Resource":["arn:aws:s3:::quorum-prod-*","arn:aws:s3:::quorum-prod-*/*"]},
                    {"Effect":"Allow","Action":["dynamodb:GetItem","dynamodb:PutItem","dynamodb:UpdateItem","dynamodb:Query"],"Resource":"*"},
                    {"Effect":"Allow","Action":["kms:Decrypt","kms:Encrypt","kms:GenerateDataKey","logs:CreateLogStream","logs:PutLogEvents"],"Resource":"*"}]}
                providerConfigRef: { name: aws-prod, kind: ProviderConfig }
          - name: scheduler-role-policy
            base:
              apiVersion: iam.aws.m.upbound.io/v1beta1
              kind: RolePolicy
              spec:
                forProvider:
                  roleSelector:
                    matchControllerRef: true
                    matchLabels: { quorum.io/role: scheduler }
                  policy: >-
                    {"Version":"2012-10-17","Statement":[
                    {"Effect":"Allow","Action":["ssm:StartAutomationExecution","ec2:StartInstances","ec2:StopInstances","rds:StartDBInstance","rds:StopDBInstance"],"Resource":"*"}]}
                providerConfigRef: { name: aws-prod, kind: ProviderConfig }
          - name: budget-role-policy
            base:
              apiVersion: iam.aws.m.upbound.io/v1beta1
              kind: RolePolicy
              spec:
                forProvider:
                  roleSelector:
                    matchControllerRef: true
                    matchLabels: { quorum.io/role: budget }
                  policy: >-
                    {"Version":"2012-10-17","Statement":[
                    {"Effect":"Allow","Action":["rds:StopDBInstance","ec2:StopInstances"],"Resource":"*"}]}
                providerConfigRef: { name: aws-prod, kind: ProviderConfig }
          - name: instance-ssm-core
            base:
              apiVersion: iam.aws.m.upbound.io/v1beta1
              kind: RolePolicyAttachment
              spec:
                forProvider:
                  policyArn: arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
                  roleSelector:
                    matchControllerRef: true
                    matchLabels: { quorum.io/role: instance }
                providerConfigRef: { name: aws-prod, kind: ProviderConfig }
          - name: instance-profile
            base:
              apiVersion: iam.aws.m.upbound.io/v1beta1
              kind: InstanceProfile
              metadata:
                annotations: { crossplane.io/external-name: quorum-prod-instance }
              spec:
                forProvider:
                  roleSelector:
                    matchControllerRef: true
                    matchLabels: { quorum.io/role: instance }
                providerConfigRef: { name: aws-prod, kind: ProviderConfig }
          - name: application-instance
            base:
              apiVersion: ec2.aws.m.upbound.io/v1beta1
              kind: Instance
              metadata:
                labels: { quorum.io/environment: prod }
              spec:
                forProvider:
                  region: ap-southeast-2
                  ami: ami-00000000000000000
                  instanceType: t4g.large
                  iamInstanceProfile: quorum-prod-instance
                  # Minimal boot stub: the real bootstrap lives in S3 so scripts can be
                  # updated and re-run on the instance without rebuilding it. Update flow:
                  # re-upload crossplane/bootstrap/ to s3://quorum-prod-deploy/bootstrap/current/,
                  # then re-run this stub (or /opt/quorum/start.sh) on the box via SSM.
                  userData: |
                    #!/usr/bin/env bash
                    set -euo pipefail
                    export AWS_REGION=ap-southeast-2
                    export DEPLOY_BUCKET=quorum-prod-deploy
                    export BOOTSTRAP_VERSION=current
                    command -v aws >/dev/null 2>&1 || dnf install -y awscli-2
                    install -d -m 0755 /opt/quorum
                    aws s3 cp "s3://${DEPLOY_BUCKET}/bootstrap/${BOOTSTRAP_VERSION}/ec2-userdata.sh" /opt/quorum/ec2-userdata.sh --region "${AWS_REGION}"
                    chmod +x /opt/quorum/ec2-userdata.sh
                    exec /opt/quorum/ec2-userdata.sh
                  subnetIdSelector:
                    matchControllerRef: true
                    matchLabels: { quorum.io/tier: public }
                  vpcSecurityGroupIdSelector:
                    matchControllerRef: true
                    matchLabels: { quorum.io/security-group: app }
                  rootBlockDevice:
                    volumeType: gp3
                    volumeSize: 30
                    encrypted: true
                  tags: { Name: quorum-prod, Environment: prod }
                providerConfigRef: { name: aws-prod, kind: ProviderConfig }
            patches:
              - { type: FromCompositeFieldPath, fromFieldPath: "spec.compute.amiId", toFieldPath: "spec.forProvider.ami" }
              - { type: FromCompositeFieldPath, fromFieldPath: "spec.compute.instanceType", toFieldPath: "spec.forProvider.instanceType" }
              - { type: FromCompositeFieldPath, fromFieldPath: "spec.compute.rootVolumeGiB", toFieldPath: "spec.forProvider.rootBlockDevice.volumeSize" }
              # Surface the instance ID for ops scripts (EC2_INSTANCE_ID) and SSM targeting.
              - { type: ToCompositeFieldPath, fromFieldPath: "status.atProvider.id", toFieldPath: "status.instanceId" }
          - name: elastic-ip
            base:
              apiVersion: ec2.aws.m.upbound.io/v1beta1
              kind: EIP
              spec:
                forProvider:
                  region: ap-southeast-2
                  domain: vpc
                providerConfigRef: { name: aws-prod, kind: ProviderConfig }
            patches:
              # Surface the allocated public IP on the XR so `deploy.sh status`
              # gives the value to point the Vercel quorum-gateway A record at.
              - { type: ToCompositeFieldPath, fromFieldPath: "status.atProvider.publicIp", toFieldPath: "status.elasticIp" }
          - name: elastic-ip-association
            base:
              apiVersion: ec2.aws.m.upbound.io/v1beta1
              kind: EIPAssociation
              spec:
                forProvider:
                  region: ap-southeast-2
                  allocationIdSelector: { matchControllerRef: true }
                  instanceIdSelector: { matchControllerRef: true }
                providerConfigRef: { name: aws-prod, kind: ProviderConfig }
          - name: log-group
            base:
              apiVersion: cloudwatchlogs.aws.m.upbound.io/v1beta1
              kind: Group
              metadata:
                annotations: { crossplane.io/external-name: /quorum/prod }
              spec:
                forProvider:
                  region: ap-southeast-2
                  retentionInDays: 14
                providerConfigRef: { name: aws-prod, kind: ProviderConfig }
          - name: ec2-stop-schedule
            base: &stopSchedule
              apiVersion: scheduler.aws.m.upbound.io/v1beta1
              kind: Schedule
              spec:
                forProvider:
                  region: ap-southeast-2
                  scheduleExpression: "cron(0 10,23 * * ? *)"
                  scheduleExpressionTimezone: Australia/Sydney
                  state: ENABLED
                  flexibleTimeWindow: { mode: "OFF" }
                  target:
                    arn: arn:aws:scheduler:::aws-sdk:ssm:startAutomationExecution
                    roleArnSelector:
                      matchControllerRef: true
                      matchLabels: { quorum.io/role: scheduler }
                    input: '{"DocumentName":"AWS-StopEC2Instance","Targets":[{"Key":"tag:Name","Values":["quorum-prod"]}]}'
                providerConfigRef: { name: aws-prod, kind: ProviderConfig }
          - name: rds-stop-schedule
            base:
              <<: *stopSchedule
              spec:
                forProvider:
                  region: ap-southeast-2
                  scheduleExpression: "cron(0 10,23 * * ? *)"
                  scheduleExpressionTimezone: Australia/Sydney
                  state: ENABLED
                  flexibleTimeWindow: { mode: "OFF" }
                  target:
                    arn: arn:aws:scheduler:::aws-sdk:rds:stopDBInstance
                    roleArnSelector:
                      matchControllerRef: true
                      matchLabels: { quorum.io/role: scheduler }
                    input: '{"DbInstanceIdentifier":"quorum-prod"}'
                providerConfigRef: { name: aws-prod, kind: ProviderConfig }
            patches:
              - type: CombineFromComposite
                toFieldPath: spec.forProvider.target.input
                combine:
                  strategy: string
                  variables:
                    - fromFieldPath: spec.database.identifier
                  string:
                    fmt: '{"DbInstanceIdentifier":"%s"}'
          - name: ec2-start-schedule
            base:
              <<: *stopSchedule
              spec:
                forProvider:
                  region: ap-southeast-2
                  scheduleExpression: "cron(0 5,16 ? * MON-FRI *)"
                  scheduleExpressionTimezone: Australia/Sydney
                  state: DISABLED
                  flexibleTimeWindow: { mode: "OFF" }
                  target:
                    arn: arn:aws:scheduler:::aws-sdk:ssm:startAutomationExecution
                    roleArnSelector:
                      matchControllerRef: true
                      matchLabels: { quorum.io/role: scheduler }
                    input: '{"DocumentName":"AWS-StartEC2Instance","Targets":[{"Key":"tag:Name","Values":["quorum-prod"]}]}'
                providerConfigRef: { name: aws-prod, kind: ProviderConfig }
          - name: rds-start-schedule
            base:
              <<: *stopSchedule
              spec:
                forProvider:
                  region: ap-southeast-2
                  scheduleExpression: "cron(0 5,16 ? * MON-FRI *)"
                  scheduleExpressionTimezone: Australia/Sydney
                  state: DISABLED
                  flexibleTimeWindow: { mode: "OFF" }
                  target:
                    arn: arn:aws:scheduler:::aws-sdk:rds:startDBInstance
                    roleArnSelector:
                      matchControllerRef: true
                      matchLabels: { quorum.io/role: scheduler }
                    input: '{"DbInstanceIdentifier":"quorum-prod"}'
                providerConfigRef: { name: aws-prod, kind: ProviderConfig }
            patches:
              - type: CombineFromComposite
                toFieldPath: spec.forProvider.target.input
                combine:
