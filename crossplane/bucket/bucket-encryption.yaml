apiVersion: s3.aws.upbound.io/v1beta1
kind: BucketServerSideEncryptionConfiguration
metadata:
  name: quorum-configs-encryption
spec:
  forProvider:
    region: us-east-1
    bucketRef:
      name: quorum-configs
    rule:
      - applyServerSideEncryptionByDefault:
          - sseAlgorithm: AES256
        # Production upgrade: switch to aws:kms.
        # Create a KMS key via Crossplane (provider-aws Key resource) and set:
        #   sseAlgorithm: aws:kms
        #   kmsMasterKeyId: arn:aws:kms:ap-southeast-2:ACCOUNT_ID:key/KEY_ID
        bucketKeyEnabled: true
  providerConfigRef:
    name: aws-provider
