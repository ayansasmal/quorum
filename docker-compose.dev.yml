# docker-compose.dev.yml — local development overlay
#
# Bind-mounts source so changes are reflected without rebuilding images.
# Extends docker-compose.yml — do not use standalone.
#
# Usage:
#   npm run docker:start --env=dev
#   QUORUM_ENV=dev ./scripts/setup.sh docker
#
# Gateway:   node --watch restarts automatically on any .js change under gateway/src/
#
# The dashboard now lives in its own repo (quorum-dash) and runs separately
# (its own Vite dev server) — it is no longer part of this stack.

name: quorum

services:

  gateway:
    # Bind-mount source over the built image — node_modules stay from the image layer.
    # node --watch (Node 24 built-in) restarts the process on any file change.
    volumes:
      - ./gateway/src:/app/gateway/src:delegated
      - ./quorum.config.example.json:/app/quorum.config.example.json:ro
    command: node --watch gateway/src/server.js
    environment:
      - NODE_ENV=development
