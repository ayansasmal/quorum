##
## Quorum CI - Build and Push Gateway Image
##
## Builds on push to prod branch:
##   ghcr.io/{repo}-gateway:*   <- Quorum Gateway (gateway/src/server.js)
##
## All active jobs share the Buildx cache.
##



name: Build

on:
  push:
    branches: [prod]
  workflow_dispatch:

env:
  GATEWAY_IMAGE: ghcr.io/${{ github.repository }}-gateway

jobs:
  build-gateway:
    name: Build Quorum Gateway Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Gateway image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GATEWAY_IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - name: Build and push Quorum Gateway image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.gateway
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,mode=max,scope=gateway
          platforms: linux/amd64,linux/arm64
