##
## Quorum CI — Test Pipeline
##
## Runs on push to main/prod and PRs targeting main.
##
## Jobs:
##   gateway-tests    <- unit tests for gateway routes + middleware
##   audit-scan       <- static analysis for audit bypasses / hard deletes (informational)
##   coverage         <- full coverage report (runs after gateway-tests)
##
## Runner strategy: test jobs run inside node:24-alpine (lightweight, no setup-node overhead).
## Docker build jobs must stay on ubuntu-latest (buildx needs full Linux kernel features).
##

name: CI

on:
  push:
    branches: [main, prod]
  pull_request:
    branches: [main]

jobs:
  gateway-tests:
    name: Gateway Tests
    runs-on: ubuntu-latest
    container:
      image: node:24-alpine
    steps:
      - name: Install git
        run: apk add --no-cache git

      - uses: actions/checkout@v4

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: npm-

      - name: Install dependencies
        run: npm install --prefer-offline

      - name: Run gateway tests
        run: npm run test:gateway
        env:
          CI: true
          NODE_ENV: test

      - name: Upload test results on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: gateway-test-results
          path: coverage/
          retention-days: 7

  audit-scan:
    name: Audit Bypass Scan
    runs-on: ubuntu-latest
    container:
      image: node:24-alpine
    steps:
      - name: Install git
        run: apk add --no-cache git

      - uses: actions/checkout@v4

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: npm-

      - name: Install dependencies
        run: npm install --prefer-offline

      - name: Scan for audit pipeline bypasses
        run: npm run audit:scan-bypasses
        continue-on-error: true

      - name: Scan for hard deletes
        run: npm run audit:scan-harddeletes
        continue-on-error: true

  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: [gateway-tests]
    container:
      image: node:24-alpine
    steps:
      - name: Install git
        run: apk add --no-cache git

      - uses: actions/checkout@v4

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: npm-

      - name: Install dependencies
        run: npm install --prefer-offline

      - name: Run full test suite with coverage
        run: npm run test:coverage
        env:
          CI: true
          NODE_ENV: test

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
