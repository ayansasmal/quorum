##
## Engram CI — Test Pipeline
##
## Job order (enforced by needs:):
##
##   constitutional-guard          ← BLOCKING — must pass before anything else
##          ↓
##   governance-tests  tool-tests  ← parallel
##          ↓
##   coverage                      ← full coverage report
##
## audit-bypass-scan runs in parallel (static analysis, informational only)
## constitutional-guard-meta runs last with if: always() — verifies guard ran
##

name: CI

on:
  push:
    branches: [main, prod]
  pull_request:
    branches: [main]

jobs:
  # ── Constitutional guard — BLOCKING ─────────────────────────────────────────
  constitutional-guard:
    name: Constitutional Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run constitutional tests (100% coverage required)
        run: npm run test:coverage:constitutional
        env:
          CI: true

      - name: Upload constitutional coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: constitutional-coverage
          path: coverage/

  # ── Static analysis — informational, never blocks ────────────────────────────
  audit-bypass-scan:
    name: Audit Bypass Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Scan for audit pipeline bypasses
        run: npm run audit:scan-bypasses
        continue-on-error: true

      - name: Scan for Graphiti delete calls
        run: npm run audit:scan-graphiti-deletes
        continue-on-error: true

  # ── Governance tests ─────────────────────────────────────────────────────────
  governance-tests:
    name: Governance Tests
    runs-on: ubuntu-latest
    needs: constitutional-guard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run governance tests
        run: npm run test:governance
        env:
          CI: true
          NODE_ENV: test

  # ── Tool tests ───────────────────────────────────────────────────────────────
  tool-tests:
    name: Tool Tests
    runs-on: ubuntu-latest
    needs: constitutional-guard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tool tests
        run: npm run test:tools
        env:
          CI: true
          NODE_ENV: test

  # ── Full coverage report ──────────────────────────────────────────────────────
  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: [governance-tests, tool-tests]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run full test suite with coverage
        run: npm run test:coverage
        env:
          CI: true
          NODE_ENV: test

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  # ── Constitutional guard meta-check (runs last, even on failure) ──────────────
  # Verifies constitutional-guard ran and was not skipped or bypassed.
  constitutional-guard-meta:
    name: Constitutional Guard — Meta Check
    runs-on: ubuntu-latest
    needs: [constitutional-guard, governance-tests, tool-tests]
    if: always()
    env:
      GUARD_RESULT: ${{ needs.constitutional-guard.result }}
    steps:
      - name: Verify constitutional guard ran and passed
        run: |
          if [ "$GUARD_RESULT" != "success" ]; then
            echo "FATAL: constitutional-guard did not pass (result: $GUARD_RESULT)"
            echo "Constitutional tests are a non-negotiable gate. They cannot be skipped."
            exit 1
          fi
          echo "Constitutional guard: PASSED"
