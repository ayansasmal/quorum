server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Use Docker's embedded DNS so nginx re-resolves 'gateway' after container restarts.
  # Without this, nginx caches the upstream IP at startup and returns 502 after a rebuild.
  resolver 127.0.0.11 valid=30s ipv6=off;

  # Proxy API calls to Gateway (Docker internal service name)
  # pg — direct PostgreSQL REST API (pending, audit, versions)
  location ~ ^/(auth|api|\.well-known|config/|health|pg|graphiti|projects|sync|schema|governance|user|admin/|bump|oauth) {
    set $upstream http://gateway:3001;
    proxy_pass $upstream;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Cache static assets aggressively — Vite hashes filenames so stale cache is impossible
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA routing — all non-asset paths serve index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
