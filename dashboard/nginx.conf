server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Proxy API calls to Gateway (Docker internal service name)
  # pg — direct PostgreSQL REST API (pending, audit, versions)
  location ~ ^/(auth|api|\.well-known|config|health|pg|graphiti|projects) {
    proxy_pass http://gateway:3001;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Cache static assets aggressively — Vite hashes filenames so stale cache is impossible
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA routing — all non-asset paths serve index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
